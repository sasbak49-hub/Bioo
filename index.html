<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO by d1mple</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-image: url('back.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.3);
            z-index: 0;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 28px;
        }

        .avatar-glow {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6B8DD6 100%);
            border-radius: 50%;
            opacity: 0.7;
            filter: blur(15px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        .avatar {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 4px;
            z-index: 1;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #f0f0f0;
            display: block;
        }

        .title {
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #0a0a0a 0%, #333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 400;
            font-style: italic;
            color: #666;
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }

        .subtitle .highlight {
            color: #764ba2;
            font-weight: 600;
        }

        .color-note {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(248, 249, 250, 0.9);
            color: #0a0a0a;
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(248, 249, 250, 0.9), rgba(248, 249, 250, 0.9)), 
                              linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .btn-secondary:hover {
            background-image: linear-gradient(#ffffff, #ffffff), 
                              linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .btn-secondary:active {
            transform: translateY(-1px);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .games {
            margin-top: 28px;
        }

        .games-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 14px;
        }

        .games-list {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .game-card {
            position: relative;
            width: 90px;
            height: 125px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card::after {
            content: attr(data-name);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 4px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            text-align: center;
        }

        .meme-section {
            margin-top: 28px;
        }

        .meme-card {
            display: inline-block;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
            max-width: 200px;
            border: 3px solid transparent;
            background: linear-gradient(#fff, #fff) padding-box,
                        linear-gradient(135deg, #667eea 0%, #764ba2 100%) border-box;
        }

        .meme-card:hover {
            transform: rotate(-2deg) scale(1.05);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.3);
        }

        .meme-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 12px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .avatar {
                width: 90px;
                height: 90px;
            }

            .avatar-wrapper {
                margin-bottom: 20px;
            }

            .title {
                font-size: 1.6rem;
            }

            .btn {
                padding: 14px 20px;
                font-size: 0.85rem;
            }

            .subtitle {
                font-size: 0.9rem;
                margin-bottom: 8px;
            }

            .color-note {
                margin-bottom: 20px;
                font-size: 0.75rem;
            }

            .games {
                margin-top: 20px;
            }

            .games-list {
                gap: 8px;
            }

            .game-card {
                width: 75px;
                height: 105px;
                border-radius: 10px;
            }

            .game-card::after {
                font-size: 0.55rem;
                padding: 5px 2px;
            }

            .meme-section {
                margin-top: 20px;
            }

            .meme-card {
                max-width: 150px;
            }
        }
    </style>
</head>
